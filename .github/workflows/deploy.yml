# Deploy this Astro site to GitHub Pages.
# GitHub runs this automatically on every push to `main`: it builds the site
# (npm install + astro build) and publishes the result to Pages.
# Reference: https://docs.astro.build/en/guides/deploy/github/
name: Deploy to GitHub Pages

on:
  # Run whenever you push to the main branch...
  push:
    branches: [main]
  # ...and also let you trigger it manually from the Actions tab.
  workflow_dispatch:

# Permissions this workflow needs to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the in-progress deploy finish rather than
# cancelling it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
